<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horror Game — Stage 1</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: 'Courier New', monospace;
        color: #ddd;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas { display: block; }

      #blocker {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 10;
        cursor: pointer;
      }
      #blocker.hidden { display: none; }
      #instructions {
        text-align: center;
        max-width: 420px;
        line-height: 1.6;
      }
      #instructions h1 { color: #b00; margin-bottom: 0.5em; }

      #prompt {
        position: absolute;
        bottom: 12%;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #666;
        padding: 8px 16px;
        border-radius: 4px;
        z-index: 5;
        display: none;
      }
      #prompt.visible { display: block; }

      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="blocker">
        <div id="instructions">
          <h1>ЗАБРОШЕННАЯ БОЛЬНИЦА</h1>
          <p>WASD — движение, мышь — осмотреться, E — взаимодействие.</p>
          <p>Кликните, чтобы начать.</p>
        </div>
      </div>
      <div id="prompt"></div>
      <div id="crosshair"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
